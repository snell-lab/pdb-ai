name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install runtime and development dependencies
        run: |
          # A local venv makes Pyright resolve the same dependency tree used by developers.
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Audit dependency licenses
        run: .venv/bin/python -m pdbai.licenses --format markdown

      - name: Type-check (mypy)
        run: .venv/bin/mypy

      - name: Type-check (pyright)
        run: .venv/bin/pyright

      - name: Lint the Jinja template
        run: .venv/bin/djlint pdbai/webapp/templates --lint

      - name: Install Biome
        # The same version as the schema in biome.jsonc, as one binary, so the
        # frontend checks need no Node.js.
        run: |
          curl -sSL -o .venv/bin/biome "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%402.5.15/biome-linux-x64"
          chmod +x .venv/bin/biome

      - name: Check and lint the script and stylesheet
        run: .venv/bin/biome ci

  supported-python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Test
        run: python -m pytest -q
